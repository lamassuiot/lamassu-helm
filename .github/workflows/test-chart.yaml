name: Lint and Test Charts

permissions:
  contents: read

on: 
  pull_request:
    branches: [main, v4]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          # Offline renders (helm lint/template without a cluster) report the
          # Kubernetes version Helm was compiled against: v1.34.0 for v3.19.0
          # (v3.12.1 reported v1.27.0). Keep it >= 1.29 so the KMS
          # pkcs11Sidecar guard does not fail on offline renders.
          version: v3.19.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --excluded-charts softhsm --target-branch ${{ github.base_ref || 'main' }} )
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check release test inputs
        id: release-test-inputs
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet "$BASE_SHA...$HEAD_SHA" -- \
            .github/workflows/release.yaml \
            .github/workflows/test-chart.yaml \
            .github/ci/ct.yaml \
            scripts/update-release-images.sh \
            scripts/test-release-image-updates.sh; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Test release image updates
        if: >-
          github.event_name != 'pull_request' ||
          steps.list-changed.outputs.changed == 'true' ||
          steps.release-test-inputs.outputs.changed == 'true'
        run: bash scripts/test-release-image-updates.sh

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --charts charts/lamassu --github-groups --target-branch ${{ github.base_ref || 'main' }}

      - name: Install manifest and documentation validators
        if: steps.list-changed.outputs.changed == 'true'
        env:
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
          HELM_DOCS_VERSION: 1.14.2
          HELM_DOCS_SHA256: a8cf72ada34fad93285ba2a452b38bdc5bd52cc9a571236244ec31022928d6cc
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            --output /tmp/kubeconform.tar.gz
          curl --fail --location --silent --show-error \
            "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz" \
            --output /tmp/helm-docs.tar.gz
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum --check
          echo "${HELM_DOCS_SHA256}  /tmp/helm-docs.tar.gz" | sha256sum --check
          sudo tar --extract --gzip --directory /usr/local/bin --file /tmp/kubeconform.tar.gz kubeconform
          sudo tar --extract --gzip --directory /usr/local/bin --file /tmp/helm-docs.tar.gz helm-docs

      - name: Validate rendered manifests
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          helm template lamassu charts/lamassu --namespace lamassu-test \
            | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.29.0

      - name: Verify Secret-backed credentials
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          set -euo pipefail

          helm template lamassu charts/lamassu \
            --namespace lamassu-test \
            >/tmp/lamassu-default-rendered.yaml
          for smtp_variable in LAMASSU_SMTP_USERNAME LAMASSU_SMTP_PASSWORD; do
            if ! grep -A1 -F "name: $smtp_variable" /tmp/lamassu-default-rendered.yaml |
              grep -Fq 'value: ""'; then
              echo "Unauthenticated SMTP must render an empty string for $smtp_variable"
              exit 1
            fi
          done

          cat >/tmp/lamassu-secret-values.yaml <<'EOF'
          postgres:
            existingSecret: lamassu-postgres
          amqp:
            existingSecret: lamassu-amqp
          services:
            alerts:
              smtp_server:
                existingSecret: lamassu-smtp
          EOF

          helm template lamassu charts/lamassu \
            --namespace lamassu-test \
            -f /tmp/lamassu-secret-values.yaml \
            >/tmp/lamassu-secret-rendered.yaml

          grep -q 'name: "lamassu-postgres"' /tmp/lamassu-secret-rendered.yaml
          grep -q 'name: "lamassu-amqp"' /tmp/lamassu-secret-rendered.yaml
          grep -q 'name: "lamassu-smtp"' /tmp/lamassu-secret-rendered.yaml
          ! grep -q '__LAMASSU_' /tmp/lamassu-secret-rendered.yaml
          grep -q 'name: LAMASSU_POSTGRES_PASSWORD' /tmp/lamassu-secret-rendered.yaml
          grep -q 'name: LAMASSU_AMQP_PASSWORD' /tmp/lamassu-secret-rendered.yaml
          grep -q 'name: LAMASSU_SMTP_PASSWORD' /tmp/lamassu-secret-rendered.yaml

          helm template lamassu charts/lamassu \
            --namespace lamassu-test \
            --set services.authz.credentials.pki.database=pki \
            >/tmp/lamassu-authz-credentials-rendered.yaml
          grep -q 'name: LAMASSU_AUTHZ_CREDENTIALS_PKI_USERNAME' \
            /tmp/lamassu-authz-credentials-rendered.yaml
          grep -q 'name: LAMASSU_AUTHZ_CREDENTIALS_PKI_PASSWORD' \
            /tmp/lamassu-authz-credentials-rendered.yaml
          grep -q 'name: LAMASSU_AUTHZ_DB_USERNAME' /tmp/lamassu-authz-credentials-rendered.yaml
          grep -q 'name: LAMASSU_AUTHZ_DB_PASSWORD' /tmp/lamassu-authz-credentials-rendered.yaml

          cat >/tmp/lamassu-authz-schema-secret-values.yaml <<'EOF'
          postgres:
            existingSecret: lamassu-postgres
            usernameKey: db-user
            passwordKey: db-password
          services:
            authz:
              credentials:
                pki:
                  database: pki
                  existingSecret: lamassu-authz-pki
                  usernameKey: login
                  passwordKey: secret
                authz:
                  database: authz
          EOF

          helm template lamassu charts/lamassu \
            --namespace lamassu-test \
            -f /tmp/lamassu-authz-schema-secret-values.yaml \
            >/tmp/lamassu-authz-schema-secret-rendered.yaml

          assert_authz_secret_ref() {
            local env_name="$1" secret_name="$2" secret_key="$3"
            local env_block
            env_block=$(grep -F -A5 -- "- name: $env_name" /tmp/lamassu-authz-schema-secret-rendered.yaml)
            test "$(grep -Fc "name: \"$secret_name\"" <<<"$env_block")" -eq 2
            test "$(grep -Fc "key: \"$secret_key\"" <<<"$env_block")" -eq 2
          }

          assert_authz_secret_ref LAMASSU_AUTHZ_CREDENTIALS_PKI_USERNAME lamassu-authz-pki login
          assert_authz_secret_ref LAMASSU_AUTHZ_CREDENTIALS_PKI_PASSWORD lamassu-authz-pki secret
          assert_authz_secret_ref LAMASSU_AUTHZ_CREDENTIALS_AUTHZ_USERNAME lamassu-postgres db-user
          assert_authz_secret_ref LAMASSU_AUTHZ_CREDENTIALS_AUTHZ_PASSWORD lamassu-postgres db-password

          # Legacy inline credentials must be rejected by the values schema.
          cat >/tmp/lamassu-inline-credentials.yaml <<'EOF'
          postgres:
            hostname: postgresql
            username: fallback-postgres-user
            password: fallback-postgres-password
          amqp:
            hostname: rabbitmq
            username: fallback-amqp-user
            password: fallback-amqp-password
          services:
            alerts:
              smtp_server:
                username: fallback-smtp-user
                password: fallback-smtp-password
          EOF
          if helm template lamassu charts/lamassu \
            --namespace lamassu-test \
            -f /tmp/lamassu-inline-credentials.yaml \
            >/tmp/lamassu-inline-credentials-rendered.yaml 2>/tmp/lamassu-inline-credentials-error.txt; then
            echo "The chart accepted legacy inline credentials"
            exit 1
          fi
          grep -Eq 'username|password' /tmp/lamassu-inline-credentials-error.txt

          cat >/tmp/lamassu-authz-inline-credentials.yaml <<'EOF'
          services:
            authz:
              credentials:
                pki:
                  database: pki
                  username: inline-user
                  password: inline-password
          EOF
          if helm template lamassu charts/lamassu \
            --namespace lamassu-test \
            -f /tmp/lamassu-authz-inline-credentials.yaml \
            >/tmp/lamassu-authz-inline-credentials-rendered.yaml 2>/tmp/lamassu-authz-inline-credentials-error.txt; then
            echo "The chart accepted inline Authz schema credentials"
            exit 1
          fi
          grep -Eq 'username|password' /tmp/lamassu-authz-inline-credentials-error.txt

          cat >/tmp/lamassu-inline-credentials-bypass.yaml <<'EOF'
          postgres:
            existingSecret: ""
            username: INLINE_POSTGRES_USERNAME
            password: INLINE_POSTGRES_PASSWORD
          amqp:
            existingSecret: ""
            username: INLINE_AMQP_USERNAME
            password: INLINE_AMQP_PASSWORD
          services:
            alerts:
              smtp_server:
                existingSecret: ""
                username: INLINE_SMTP_USERNAME
                password: INLINE_SMTP_PASSWORD
          EOF
          helm template lamassu charts/lamassu \
            --namespace lamassu-test \
            --skip-schema-validation \
            -f /tmp/lamassu-inline-credentials-bypass.yaml \
            >/tmp/lamassu-inline-credentials-bypass-rendered.yaml
          if grep -Eq 'INLINE_(POSTGRES|AMQP|SMTP)_(USERNAME|PASSWORD)' \
            /tmp/lamassu-inline-credentials-bypass-rendered.yaml; then
            echo "A template rendered an inline credential when schema validation was skipped"
            exit 1
          fi

          migration_job=$(awk '
            /^kind: Job$/ { in_job=1 }
            in_job && /^  name: lamassu-db-migration$/ { found=1 }
            found { print }
            found && /^---$/ { exit }
          ' /tmp/lamassu-secret-rendered.yaml)
          if grep -Eq '^[[:space:]]*- name: LAMASSU_(AMQP|SMTP)_(USERNAME|PASSWORD)$' <<<"$migration_job"; then
            echo "Database migration received unrelated AMQP or SMTP credentials"
            exit 1
          fi

      - name: Verify CA-to-KMS migration ConfigMap sources
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          set -euo pipefail

          helm template lamassu charts/lamassu \
            --namespace lamassu-test \
            --set migrations.caToKms.enabled=true \
            >/tmp/lamassu-ca-to-kms.yaml

          job=$(awk '
            /^kind: Job$/ { in_job=1 }
            in_job && /^  name: lamassu-ca-to-kms-migration$/ { found=1 }
            found { print }
            found && /^---$/ { exit }
          ' /tmp/lamassu-ca-to-kms.yaml)

          kubeconform -strict -summary -ignore-missing-schemas \
            -kubernetes-version 1.29.0 /tmp/lamassu-ca-to-kms.yaml

          config_map_sources=$(awk '
            /^            sources:$/ { in_sources=1; next }
            in_sources && /^              - configMap:$/ {
              if (in_config_map) {
                print config_map_name "|" config_map_optional
              }
              in_config_map=1
              config_map_name=""
              config_map_optional=""
              next
            }
            in_sources && in_config_map && /^                  name: / {
              config_map_name=$0
              sub(/^                  name: /, "", config_map_name)
              next
            }
            in_sources && in_config_map && /^                  optional: / {
              config_map_optional=$0
              sub(/^                  optional: /, "", config_map_optional)
              next
            }
            in_sources && /^---$/ { exit }
            END {
              if (in_config_map) {
                print config_map_name "|" config_map_optional
              }
            }
          ' <<<"$job")

          expected_config_map_sources=$'lamassu-kms-config|true\nkms-config|true'
          test "$config_map_sources" = "$expected_config_map_sources"
          grep -q '"helm.sh/hook-weight": "-10"' <<<"$job"

      - name: Verify TLS provider-specific resources
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          set -euo pipefail

          helm template lamassu charts/lamassu \
            --namespace lamassu-test \
            --set tls.type=external \
            --set tls.externalOptions.secretName=provided-tls \
            >/tmp/lamassu-external-tls.yaml

          kubeconform -strict -summary -ignore-missing-schemas \
            -kubernetes-version 1.29.0 /tmp/lamassu-external-tls.yaml

          gateway_tls_secret() {
            awk '
              /^kind: Gateway$/ { in_gateway = 1 }
              /^---$/ { in_gateway = 0; in_tls = 0 }
              in_gateway && /^[[:space:]]+certificateRefs:$/ { in_tls = 1; next }
              in_gateway && in_tls && /^[^[:space:]]/ { in_tls = 0 }
              in_gateway && in_tls && /^[[:space:]]+name:/ {
                sub(/^[[:space:]]+name:[[:space:]]*/, "")
                print
                exit
              }
            ' "$1"
          }

          test "$(gateway_tls_secret /tmp/lamassu-external-tls.yaml)" = "provided-tls"
          if grep -q 'apiVersion: cert-manager.io/v1' /tmp/lamassu-external-tls.yaml; then
            echo "External TLS unexpectedly rendered cert-manager resources"
            exit 1
          fi

          helm template lamassu charts/lamassu \
            --namespace lamassu-test \
            --set tls.type=certManager \
            >/tmp/lamassu-certmanager-tls.yaml
          test "$(grep -c 'apiVersion: cert-manager.io/v1' /tmp/lamassu-certmanager-tls.yaml)" -eq 4
          test "$(gateway_tls_secret /tmp/lamassu-certmanager-tls.yaml)" = "lamassu-downstream-tls"

      - name: Verify deprecated CA crypto engines are rejected
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          set +e

          helm lint charts/lamassu -f .github/ci/reject-ca-crypto-engines-values.yaml >/tmp/helm-lint-rejection.log 2>&1
          lint_status=$?

          helm template lamassu charts/lamassu -f .github/ci/reject-ca-crypto-engines-values.yaml >/tmp/helm-template-rejection.log 2>&1
          template_status=$?

          cat /tmp/helm-lint-rejection.log
          cat /tmp/helm-template-rejection.log

          if [[ "$lint_status" -eq 0 || "$template_status" -eq 0 ]]; then
            echo "services.ca.cryptoEngines was unexpectedly accepted"
            exit 1
          fi

          if ! grep -q "specifications of the schema" /tmp/helm-lint-rejection.log ||
            ! grep -q "specifications of the schema" /tmp/helm-template-rejection.log ||
            ! grep -q "services.ca" /tmp/helm-lint-rejection.log ||
            ! grep -q "services.ca" /tmp/helm-template-rejection.log; then
            echo "Helm did not reject services.ca.cryptoEngines for schema validation"
            exit 1
          fi

      - name: Check generated values documentation
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          helm-docs --chart-search-root charts/lamassu --output-file VALUES.md
          git diff --exit-code -- charts/lamassu/VALUES.md

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          wait: 180s
          verbosity: 10

      - name: Build and load HSM images from this checkout
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          docker build --file ci/softhsm/dockerfile --tag ghcr.io/lamassuiot/softhsm:ci-local ci/softhsm
          docker build --file ci/softhsm/proxy.dockerfile --tag ghcr.io/lamassuiot/p11-kit-ssh-sidecar:ci-local ci/softhsm
          cluster_name=$(kind get clusters)
          kind load docker-image --name "$cluster_name" ghcr.io/lamassuiot/softhsm:ci-local ghcr.io/lamassuiot/p11-kit-ssh-sidecar:ci-local

      - name: Prepare kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.20.2/cert-manager.yaml --wait
          helm install eg oci://docker.io/envoyproxy/gateway-helm --version v1.8.0 -n envoy-gateway-system --create-namespace -f .github/ci/eg.yaml --wait --timeout 300s
          cat <<EOF | kubectl apply -f -
            apiVersion: gateway.networking.k8s.io/v1
            kind: GatewayClass
            metadata:
              name: eg
            spec:
              controllerName: gateway.envoyproxy.io/gatewayclass-controller
          EOF
          kubectl wait --timeout=5m -n envoy-gateway-system deployment/envoy-gateway --for=condition=Available

          kubectl create namespace lamassu-test
          ci_db_password=$(openssl rand -hex 24)
          kubectl create secret generic lamassu-postgres \
            --from-literal=username=admin \
            --from-literal=password="$ci_db_password" \
            -n lamassu-test
          kubectl create secret generic lamassu-amqp \
            --from-literal=username=admin \
            --from-literal=password="$ci_db_password" \
            -n lamassu-test
          kubectl create secret generic lamassu-smtp \
            --from-literal=username=smtp-ci \
            --from-literal=password="$ci_db_password" \
            -n lamassu-test
          helm install postgres oci://registry-1.docker.io/cloudpirates/postgres --version 0.19.5 -n lamassu-test -f .github/ci/postgres.yaml \
            --set-string auth.password="$ci_db_password" \
            --wait --timeout 600s

          # CRITICAL: Wait for PostgreSQL to be fully ready before proceeding
          echo "Waiting for PostgreSQL to be fully operational..."
          kubectl wait --for=condition=Ready pod -l app.kubernetes.io/name=postgres -n lamassu-test --timeout=300s

          # Verify databases are created and PostgreSQL is accepting connections
          echo "Verifying PostgreSQL databases are initialized..."
          pg_password="$ci_db_password"
          kubectl run pg-check --image=docker.io/bitnamilegacy/postgresql:17.6.0-debian-12-r4 --rm -i --restart=Never -n lamassu-test \
            --env="PGPASSWORD=$pg_password" -- \
            psql -h postgresql -U admin -d auth -c "SELECT 1" || \
            (echo "Database not ready, waiting longer..." && sleep 30 && \
             kubectl run pg-check-retry --image=docker.io/bitnamilegacy/postgresql:17.6.0-debian-12-r4 --rm -i --restart=Never -n lamassu-test \
             --env="PGPASSWORD=$pg_password" -- \
             psql -h postgresql -U admin -d auth -c "SELECT 1")

          echo "PostgreSQL is ready and databases are accessible"

          helm install auth oci://registry-1.docker.io/cloudpirates/keycloak --version 0.21.9 -n lamassu-test -f .github/ci/keycloak.yaml \
            --set-string database.password="$ci_db_password" \
            --wait --timeout 600s
          helm install rabbitmq oci://registry-1.docker.io/cloudpirates/rabbitmq --version 0.21.4 -n lamassu-test -f .github/ci/rabbitmq.yaml \
            --set-string auth.password="$ci_db_password" \
            --wait --timeout 300s

      - name: Prepare SoftHSM for PKCS11 CI test
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          key_dir=$(mktemp -d)
          ssh-keygen -q -t ed25519 -N "" -f "$key_dir/ssh-key" -C "lamassu-ci-pkcs11"
          kubectl create secret generic kms-pkcs11-sidecar-ssh-key \
            --from-file=.key="$key_dir/ssh-key" \
            -n lamassu-test
          helm install hsm charts/softhsm -n lamassu-test \
            --set-string image="ghcr.io/lamassuiot/softhsm:ci-local" \
            --set-string global.imagePullPolicy=IfNotPresent \
            --set-string ssh.authorizedKeys="$(cat "$key_dir/ssh-key.pub")" \
            --set-string softhsm.pin="1234" \
            --set-string softhsm.so_pin="5432" \
            --wait

      # KNOWN ISSUE: this currently still fails when testing
      # charts/lamassu/ci/pkcs11-incluster-hsm-values.yaml. KMS never reaches
      # Ready because ghcr.io/lamassuiot/lamassu-kms:3.8.0's PKCS11 engine
      # fails with CKR_CRYPTOKI_NOT_INITIALIZED — confirmed (via pkcs11-tool,
      # bypassing KMS entirely) to be a regression in the KMS application
      # itself against this exact chart-provisioned tunnel/module setup, not
      # a bug in this chart. See charts/lamassu/ci/pkcs11-incluster-hsm-values.yaml
      # for details; this step should start passing once a KMS release with
      # the PKCS11 fix is available.
      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct install --config .github/ci/ct.yaml --github-groups --target-branch ${{ github.base_ref || 'main' }}
