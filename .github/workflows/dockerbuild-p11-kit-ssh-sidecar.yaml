name: "Build Docker (multi-arch): P11-Kit SSH Sidecar"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag (example: dev, v3.8.0). Max 122 characters; cannot be 'latest' or start with a number."
        required: true

run-name: "Build Docker (multi-arch): P11-Kit SSH Sidecar: ${{ inputs.tag }}"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate_tag:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve and validate tag
        id: tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ "${TAG,,}" == "latest" ]]; then
            echo "Error: tag 'latest' is not allowed." >&2
            exit 1
          fi

          if ! [[ "$TAG" =~ ^[A-Za-z_][A-Za-z0-9_.-]{0,121}$ ]]; then
            echo "Error: invalid Docker tag '$TAG'." >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: validate_tag

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64

          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.platform }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ci/softhsm
          file: ci/softhsm/proxy.dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          sbom: true
          tags: |
            ghcr.io/lamassuiot/p11-kit-ssh-sidecar:${{ needs.validate_tag.outputs.tag }}-${{ matrix.arch }}

  manifest:
    needs:
      - validate_tag
      - build

    runs-on: ubuntu-24.04

    permissions:
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-architecture manifest
        env:
          TAG: ${{ needs.validate_tag.outputs.tag }}
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/lamassuiot/p11-kit-ssh-sidecar:${TAG}" \
            "ghcr.io/lamassuiot/p11-kit-ssh-sidecar:${TAG}-amd64" \
            "ghcr.io/lamassuiot/p11-kit-ssh-sidecar:${TAG}-arm64"

      - name: Inspect manifest
        env:
          TAG: ${{ needs.validate_tag.outputs.tag }}
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/lamassuiot/p11-kit-ssh-sidecar:${TAG}"
