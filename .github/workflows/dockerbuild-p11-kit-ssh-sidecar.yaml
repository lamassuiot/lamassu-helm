name: "Build Docker (multi-arch): P11-Kit SSH Sidecar"

on:
  pull_request:
    paths:
      - ci/softhsm/**
      - .github/workflows/dockerbuild-p11-kit-ssh-sidecar.yaml
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag (example: dev, v3.8.0). Max 122 characters; cannot be 'latest' or start with a number."
        required: true

run-name: >-
  ${{ format('Build Docker (multi-arch): P11-Kit SSH Sidecar: {0}', github.event.inputs.tag || 'PR') }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  pr_build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build without publishing
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ci/softhsm
          file: ci/softhsm/proxy.dockerfile
          platforms: linux/amd64
          push: false

  validate_tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve and validate tag
        id: tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ "${TAG,,}" == "latest" ]]; then
            echo "Error: tag 'latest' is not allowed." >&2
            exit 1
          fi

          if ! [[ "$TAG" =~ ^[A-Za-z_][A-Za-z0-9_.-]{0,121}$ ]]; then
            echo "Error: invalid Docker tag '$TAG'." >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: validate_tag

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64

          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.platform }}
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ci/softhsm
          file: ci/softhsm/proxy.dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          sbom: true
          tags: |
            ghcr.io/lamassuiot/p11-kit-ssh-sidecar:${{ needs.validate_tag.outputs.tag }}-${{ matrix.arch }}

  manifest:
    needs:
      - validate_tag
      - build

    runs-on: ubuntu-24.04

    permissions:
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-architecture manifest
        env:
          TAG: ${{ needs.validate_tag.outputs.tag }}
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/lamassuiot/p11-kit-ssh-sidecar:${TAG}" \
            "ghcr.io/lamassuiot/p11-kit-ssh-sidecar:${TAG}-amd64" \
            "ghcr.io/lamassuiot/p11-kit-ssh-sidecar:${TAG}-arm64"

      - name: Inspect manifest
        env:
          TAG: ${{ needs.validate_tag.outputs.tag }}
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/lamassuiot/p11-kit-ssh-sidecar:${TAG}"
