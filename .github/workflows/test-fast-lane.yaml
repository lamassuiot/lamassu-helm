name: Fast lane Test

permissions:
  contents: read

on: workflow_dispatch

jobs:
  fast-lane-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Add hosts to /etc/hosts
        run: |
          VM_IP=$(hostname -I | awk '{print $1}')
          sudo echo "$VM_IP ci.lamassu.io" | sudo tee -a /etc/hosts
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          # Offline renders report the Kubernetes version Helm was compiled
          # against (v1.34.0 for v3.19.0); keep it >= 1.29 for the KMS
          # pkcs11Sidecar guard.
          version: v3.19.0
      - name: Create kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          config: .github/ci/kind.yaml
      - name: Prepare kind cluster
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.20.2/cert-manager.yaml --wait
          helm install eg oci://docker.io/envoyproxy/gateway-helm --version v1.8.0 -n envoy-gateway-system --create-namespace -f .github/ci/eg.yaml --wait
          cat <<EOF | kubectl apply -f -
            apiVersion: gateway.networking.k8s.io/v1
            kind: GatewayClass
            metadata:
              name: eg
            spec:
              controllerName: gateway.envoyproxy.io/gatewayclass-controller
          EOF
          kubectl wait --timeout=5m -n envoy-gateway-system deployment/envoy-gateway --for=condition=Available
                
          kubectl create namespace lamassu-ci
      - name: Run fast lane
        run: |
          ./scripts/lamassu-fast-lane.sh -n -ns lamassu-ci -d ci.lamassu.io -l ./charts/lamassu
          for external_secret in lamassu-postgres lamassu-amqp lamassu-keycloak-admin; do
            kubectl wait --for=condition=Ready "externalsecret/$external_secret" \
              -n lamassu-ci --timeout=2m
            kubectl get secret "$external_secret" -n lamassu-ci >/dev/null
          done
          yq -e '.postgres.existingSecret == "lamassu-postgres" and .postgres.username == null and .postgres.password == null and .amqp.existingSecret == "lamassu-amqp" and .amqp.username == null and .amqp.password == null and .services.authz.credentials.pki.existingSecret == "lamassu-postgres" and .services.authz.credentials.pki.username == null and .services.authz.credentials.pki.password == null and .services.authz.credentials.authz.existingSecret == "lamassu-postgres" and .services.authz.credentials.authz.username == null and .services.authz.credentials.authz.password == null' lamassu.yaml >/dev/null
          yq -e '.auth.existingSecret == "lamassu-postgres" and .auth.secretKeys.adminPasswordKey == "password" and .auth.password == null' postgres.yaml >/dev/null
          yq -e '.auth.existingSecret == "lamassu-amqp" and .auth.existingPasswordKey == "password" and .auth.password == null' rabbitmq.yaml >/dev/null
          yq -e '.database.existingSecret == "lamassu-postgres" and .database.secretKeys.usernameKey == "username" and .database.secretKeys.passwordKey == "password" and .database.username == null and .database.password == null and .keycloak.existingSecret == "lamassu-keycloak-admin" and .keycloak.secretKeys.adminPasswordKey == "admin-password" and .keycloak.adminPassword == null' keycloak.yaml >/dev/null
      - name: Show info
        run: |
          kubectl get pods -A
          kubectl get svc -A
          kubectl get gtw -A
      - name: Run helm tests
        run: |
          helm test -n lamassu-ci lamassu --logs