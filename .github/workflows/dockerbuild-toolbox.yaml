name: "Build Docker (multi-arch): toolbox"

on:
  workflow_dispatch:
    inputs:
      release_version:
        type: string
        description: "Release version for the Docker image (example: 2.2.0)"

run-name: >-
  ${{ format('Build Docker (multi-arch): toolbox: {0}', github.event.inputs.release_version) }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: ci/toolbox
          file: ci/toolbox/dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/lamassuiot/toolbox:latest
            ghcr.io/lamassuiot/toolbox:${{ github.event.inputs.release_version }}
