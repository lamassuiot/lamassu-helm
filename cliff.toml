[changelog]
header = ""
body = """
{% if version %}\
<a name="{{ version }}"></a>
## {% if previous.version %}[{{ version }}](https://github.com/lamassuiot/lamassu-helm/compare/{{ previous.version }}...{{ version }}){% else %}{{ version }}{% endif %} ({{ timestamp | date(format=\"%Y-%m-%d\") }})
{% else %}\
## Unreleased
{% endif %}

{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
### {{ entry.group | striptags | trim | upper_first }}

{% for commit in entry.commits %}
{% if commit.breaking %}* **BREAKING:** {% else %}* {% endif %}{{ commit.message | upper_first }}
{% if commit.breaking and commit.breaking_description != commit.message %}  * {{ commit.breaking_description | upper_first }}
{% endif %}
{% endfor %}

{% endfor %}
"""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = false
commit_preprocessors = [
    { pattern = '\(([A-Za-z]+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/lamassuiot/lamassu-helm/issues/${2}))" },
]
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^revert", group = "Reverts" },
    { message = "^remove", group = "Removed" },
    { message = "^security", group = "Security Fixes" },
    { message = "^test", group = "Tests" },
    { message = "^chore", group = "Chores" },
    { message = "^refactor", group = "Refactor" },
    { message = "^docs", group = "Documentation" },
    { message = "^build", group = "Build" },
    { message = "^ci", group = "Continuous Integration" },
    { message = ".*", group = "Other" },
]
tag_pattern = "(?:lamassu|softhsm)-[0-9].*"
sort_commits = "oldest"
