{{- if and (eq .Values.tls.type "external") (empty .Values.tls.externalOptions.secretName) }}
  {{ fail "tls.type is set to external but tls.externalOptions.secretName is empty. Provide the name of a Secret (containing tls.crt and tls.key) for the downstream API Gateway/DMS Manager certificate." }}
{{- end }}
{{- if eq .Values.tls.type "certManager" }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "lamassu.componentName" (dict "root" $ "component" "downstream-tls-certificate") }}
  {{- include "lamassu.resourceMetadata" (dict "root" $ "component" "tls") | nindent 2 }}
spec:
  isCA: false
  commonName: {{.Values.tls.certManagerOptions.certSpec.commonName}}
  duration: {{.Values.tls.certManagerOptions.certSpec.duration}}
  dnsNames: 
    {{- range .Values.tls.certManagerOptions.certSpec.hostnames }}
    - {{ . }}
    {{- end }}
  ipAddresses:
    {{- range .Values.tls.certManagerOptions.certSpec.addresses }}
    - {{ . }}
    {{- end }}
  secretName: {{ include "downstream.certSecret" . }}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: "Always"
  issuerRef:
    {{ if ne .Values.tls.certManagerOptions.clusterIssuer "" }}
    kind: ClusterIssuer
    name: {{ .Values.tls.certManagerOptions.clusterIssuer }}
    {{ else }}
    kind: Issuer
    name: {{ include "downstream.issuerName" . }}
    {{ end }}
    group: cert-manager.io
{{- end }}
