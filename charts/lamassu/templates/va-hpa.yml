{{- $svc := include "lamassu.svc.merged" (dict "root" $ "svcKey" "va") | fromYaml -}}
{{- if $svc.autoscaling.enabled }}
{{- include "lamassu.autoscaling.validate" (dict "name" "va" "autoscaling" $svc.autoscaling) }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "lamassu.componentName" (dict "root" $ "component" "va") }}
  {{- include "lamassu.resourceMetadata" (dict "root" $ "component" "va") | nindent 2 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: {{ include "lamassu.componentName" (dict "root" $ "component" "va") }}
  minReplicas: {{ $svc.autoscaling.minReplicas }}
  maxReplicas: {{ $svc.autoscaling.maxReplicas }}
  metrics:
    {{- include "lamassu.autoscaling.metrics" $svc.autoscaling | nindent 4 }}
{{- end }}
