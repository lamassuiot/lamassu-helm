{{- $svc := include "lamassu.svc.merged" (dict "root" $ "svcKey" "dmsManager") | fromYaml -}}
kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ include "lamassu.componentName" (dict "root" $ "component" "dms-manager-config") }}
  {{- include "lamassu.resourceMetadata" (dict "root" $ "component" "dms-manager") | nindent 2 }}
data:
  init.sh: |
    #!/bin/bash
    BLUE='\033[0;34m'
    GREEN='\033[0;32m'
    ORANGE='\033[0;33m'
    RED='\033[0;31m'
    NOCOLOR='\033[0m'

    # The bundle certificate file
    BUNDLE_CRT_FILE=/shared/bundle.crt

    # The output root certificate file
    ROOT_CA_CRT_FILE=/shared/root.crt

    touch $BUNDLE_CRT_FILE

    echo -e "${BLUE}Bundling certificates...${NOCOLOR}"
    if [ ! -f /certs/downstream.crt ]; then
      echo -e "${RED}downstream.crt not found!${NOCOLOR}"
      exit 1
    else
      cat /certs/downstream.crt > $BUNDLE_CRT_FILE
    fi

    if [ -f /certs/downstream-ca.crt ]; then
      echo -e "${GREEN}downstream-ca.crt found!${NOCOLOR}"
      cat /certs/downstream-ca.crt >> $BUNDLE_CRT_FILE
    else
      echo -e "${ORANGE}downstream-ca.crt not found!${NOCOLOR}"
    fi

    echo -e "${BLUE}Printing certificate bundle...${NOCOLOR}"
    cat $BUNDLE_CRT_FILE

    echo -e "${BLUE}Extracting root (lowest hierarchy cert in bundle)...${NOCOLOR}"
    touch $ROOT_CA_CRT_FILE

    # Count the number of certificates in the bundle
    CERT_COUNT=$(grep -c 'END CERTIFICATE' $BUNDLE_CRT_FILE)

    # Extract the root certificate
    awk "BEGIN {p=0;} /BEGIN CERTIFICATE/ {p++;} p==$CERT_COUNT" $BUNDLE_CRT_FILE > $ROOT_CA_CRT_FILE

    echo "Root CA certificate has been extracted to $ROOT_CA_CRT_FILE"
    echo -e "${GREEN}Certificate Root extracted!${NOCOLOR}"
    cat $ROOT_CA_CRT_FILE

  config: |
    {{- include "lamassu.config.header" (dict "logsLevel" "trace" "healthCheck" false "port" $svc.port) | nindent 4 }}

    {{- include "lamassu.config.eventbus" (dict "root" $ "key" "publisher_event_bus") | nindent 4 }}

    {{- include "lamassu.config.storage" $ | nindent 4 }}

    device_manager_client:
      log_level: debug
      auth_mode: noauth
      protocol: http
      hostname: {{ include "lamassu.componentName" (dict "root" $ "component" "device-manager") }}
      port: {{ include "lamassu.config.servicePort" (dict "root" $ "svcKey" "deviceManager") }}

    ca_client:
      log_level: debug
      auth_mode: noauth
      protocol: http
      hostname: {{ include "lamassu.componentName" (dict "root" $ "component" "ca") }}
      port: {{ include "lamassu.config.servicePort" (dict "root" $ "svcKey" "ca") }}

    {{- include "lamassu.config.authzClient" $ | nindent 4 }}
    downstream_cert_file: /shared/root.crt
    {{- include "lamassu.config.otel" $ | nindent 4 }}
