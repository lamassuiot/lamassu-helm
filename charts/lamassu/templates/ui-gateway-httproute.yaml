{{- $svc := include "lamassu.svc.merged" (dict "root" $ "svcKey" "ui") | fromYaml -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "lamassu.componentName" (dict "root" $ "component" "ui") }}
  {{- include "lamassu.resourceMetadata" (dict "root" $ "component" "ui") | nindent 2 }}
spec:
  parentRefs:
    {{- include "lamassu.gatewayParentRef" (dict "root" $) | nindent 4 }}
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
      backendRefs:
        - name: {{ include "lamassu.componentName" (dict "root" $ "component" "ui") }}
          port: {{ $svc.port }}
