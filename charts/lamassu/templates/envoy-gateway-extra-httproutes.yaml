{{ range $index, $svc := .Values.gateway.extraRouting }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "lamassu.componentName" (dict "root" $ "component" $svc.name) }}
  {{- include "lamassu.resourceMetadata" (dict "root" $ "component" $svc.name) | nindent 2 }}
spec:
  parentRefs:
    - name: {{ include "lamassu.componentName" (dict "root" $ "component" "gateway") }}
      sectionName: https  # The specific listener
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: {{ $svc.path }}
      filters:
      - type: RequestHeaderModifier
        requestHeaderModifier:
          set:
            - name: X-Forwarded-Port
              value: "{{ $.Values.gateway.ports.https }}"
      backendRefs:
        - name: {{ $svc.target.host }}
          port: {{ $svc.target.port }}
---
{{ end }}
