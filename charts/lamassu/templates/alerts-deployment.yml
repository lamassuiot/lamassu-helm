{{- $svc := include "lamassu.svc.merged" (dict "root" $ "svcKey" "alerts") | fromYaml -}}
{{- $resourceName := include "lamassu.componentName" (dict "root" $ "component" "alerts") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $resourceName }}
  {{- include "lamassu.workloadMetadata" (dict "root" $ "name" "alerts" "svc" $svc) | nindent 2 }}
spec:
  {{- if not $svc.autoscaling.enabled }}
  replicas: {{ $svc.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "lamassu.selectorLabels" (dict "root" $ "component" "alerts") | nindent 6 }}
  template:
    metadata:
      {{- include "lamassu.podMetadata" (dict "root" $ "name" "alerts" "svc" $svc) | nindent 6 }}
    spec:
      serviceAccountName: {{ include "lamassu.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with $svc.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $svc.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: alerts
          image: {{ $svc.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy | quote }}
          {{- with $svc.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $svc.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $svc.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $svc.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "lamassu.httpProbe" (dict "name" "livenessProbe" "probe" $svc.livenessProbe "port" $svc.port) | nindent 10 }}
          {{- include "lamassu.httpProbe" (dict "name" "readinessProbe" "probe" $svc.readinessProbe "port" $svc.port) | nindent 10 }}
          {{- include "lamassu.httpProbe" (dict "name" "startupProbe" "probe" $svc.startupProbe "port" $svc.port) | nindent 10 }}
          {{- with $svc.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: api-config
              mountPath: /etc/lamassuiot/config.yml
              subPath: config
          ports:
            - containerPort: {{ $svc.port }}
      restartPolicy: Always
      {{- include "lamassu.podPlacement" (dict "svc" $svc) | nindent 6 }}
      volumes:
        - name: api-config
          configMap:
            name: {{ include "lamassu.componentName" (dict "root" $ "component" "alerts-config") }}
