{{- $hasFilesystemEngine := include "kms.hasFilesystemEngine" . | eq "true" -}}
{{- $svc := include "lamassu.svc.merged" (dict "root" $ "svcKey" "kms") | fromYaml -}}
{{- $podSecurityContext := deepCopy $svc.podSecurityContext -}}
{{- $resourceName := include "lamassu.componentName" (dict "root" $ "component" "kms") -}}
{{- if and (or $hasFilesystemEngine $svc.pkcs11Sidecar.enabled) (not (hasKey $podSecurityContext "fsGroup")) -}}
{{- $_ := set $podSecurityContext "fsGroup" 65532 -}}
{{- end -}}

{{- if and $hasFilesystemEngine (gt (int $svc.replicaCount) 1) -}}
  {{ fail "KMS replicaCount > 1 is not supported with the filesystem crypto engine. Switch to an external engine (hashicorp_vault, aws_kms, aws_secrets_manager, pkcs11) to enable multiple replicas." }}
{{- end -}}
{{- if and $hasFilesystemEngine $svc.autoscaling.enabled -}}
  {{ fail "KMS autoscaling is not supported with the filesystem crypto engine. Switch to an external engine to enable autoscaling." }}
{{- end -}}
{{- if and $svc.pkcs11Sidecar.enabled (not (semverCompare ">=1.29.0-0" .Capabilities.KubeVersion.Version)) -}}
  {{ fail (printf "services.kms.pkcs11Sidecar.enabled=true requires Kubernetes 1.29 or newer because restartPolicy: Always on init containers uses native sidecar semantics (detected %s)" .Capabilities.KubeVersion.Version) }}
{{- end -}}
{{- if and $svc.pkcs11Sidecar.enabled (empty $svc.pkcs11Sidecar.image) -}}
  {{ fail "services.kms.pkcs11Sidecar.image is required when services.kms.pkcs11Sidecar.enabled=true" }}
{{- end -}}
{{- range $svc.pkcs11Modules -}}
{{- if empty (.image | default "") -}}
  {{ fail "each services.kms.pkcs11Modules entry requires an image" }}
{{- end -}}
{{- end -}}

apiVersion: apps/v1
kind: {{ ternary "StatefulSet" "Deployment" $hasFilesystemEngine }}
metadata:
  name: {{ $resourceName }}
  {{- include "lamassu.workloadMetadata" (dict "root" $ "name" "kms" "svc" $svc) | nindent 2 }}
spec:
  {{- if not $svc.autoscaling.enabled }}
  replicas: {{ $svc.replicaCount }}
  {{- end }}
  {{- if $hasFilesystemEngine }}
  serviceName: {{ $resourceName }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "lamassu.selectorLabels" (dict "root" $ "component" "kms") | nindent 6 }}
  template:
    metadata:
      {{- include "lamassu.podMetadata" (dict "root" $ "name" "kms" "svc" $svc) | nindent 6 }}
    spec:
      serviceAccountName: {{ include "lamassu.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with $svc.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or $svc.pkcs11Modules $svc.pkcs11Sidecar.enabled }}
      initContainers:
        {{- range $module := $svc.pkcs11Modules }}
        {{- $moduleName := $module.name | default "module" }}
        {{- $moduleDir := $module.mountPath | default "/run/pkcs11-modules" }}
        {{- $moduleSecurityDefaults := dict
          "allowPrivilegeEscalation" false
          "capabilities" (dict "drop" (list "ALL")) -}}
        {{- $moduleSecurityContext := mustMergeOverwrite (deepCopy $moduleSecurityDefaults) (deepCopy ($module.securityContext | default dict)) }}
        # Stage the PKCS#11 module and its configuration into a shared volume.
        - name: {{ printf "kms-pkcs11-module-%s" $moduleName | trunc 63 | trimSuffix "-" }}
          image: {{ $module.image | quote }}
          imagePullPolicy: {{ $module.imagePullPolicy | default "IfNotPresent" | quote }}
          {{- with $moduleSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $module.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $module.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: PKCS11_MODULE_DIR
              value: {{ $moduleDir | quote }}
            {{- with $module.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: {{ printf "pkcs11-module-%s" $moduleName | trunc 63 | trimSuffix "-" }}
              mountPath: {{ $moduleDir | quote }}
        {{- end }}
        {{- if $svc.pkcs11Sidecar.enabled }}
        {{- $sidecarSecurityContext := mustMergeOverwrite (deepCopy $svc.securityContext) (deepCopy ($svc.pkcs11Sidecar.securityContext | default dict)) }}
        # Native sidecar init container; requires Kubernetes 1.29 or newer.
        - name: kms-pkcs11-sidecar
          image: {{ $svc.pkcs11Sidecar.image | quote }}
          imagePullPolicy: {{ $svc.pkcs11Sidecar.imagePullPolicy | quote }}
          {{- with $sidecarSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          restartPolicy: Always
          {{- with $svc.pkcs11Sidecar.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $svc.pkcs11Sidecar.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $svc.pkcs11Sidecar.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            exec:
              command: ["test", "-S", {{ printf "%s/pkcs11" $svc.pkcs11Sidecar.socketDir | quote }}]
            initialDelaySeconds: 2
            periodSeconds: 2
          volumeMounts:
            - name: pkcs11-socket
              mountPath: {{ $svc.pkcs11Sidecar.socketDir | quote }}
            {{- with $svc.pkcs11Sidecar.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $svc.pkcs11Sidecar.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: kms
          image: {{ $svc.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy | quote }}
          {{- with $svc.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $svc.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $svc.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $hasEngineEnv := false -}}
          {{- range $engine := $svc.cryptoEngines.engines }}
          {{- if and (eq $engine.type "pkcs11") (dig "module_extra_options" "env" dict $engine) }}
          {{- $hasEngineEnv = true -}}
          {{- end }}
          {{- end }}
          {{- if or $hasEngineEnv $svc.extraEnv }}
          env:
            {{- range $engine := $svc.cryptoEngines.engines }}
            {{- if eq $engine.type "pkcs11" }}
            {{- range $key, $value := (dig "module_extra_options" "env" dict $engine) }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with $svc.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- include "lamassu.httpProbe" (dict "name" "livenessProbe" "probe" $svc.livenessProbe "port" $svc.port) | nindent 10 }}
          {{- include "lamassu.httpProbe" (dict "name" "readinessProbe" "probe" $svc.readinessProbe "port" $svc.port) | nindent 10 }}
          {{- include "lamassu.httpProbe" (dict "name" "startupProbe" "probe" $svc.startupProbe "port" $svc.port) | nindent 10 }}
          {{- with $svc.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: api-config
              mountPath: /etc/lamassuiot/config.yml
              subPath: config
            {{- if $svc.pkcs11Sidecar.enabled }}
            - name: pkcs11-socket
              mountPath: {{ $svc.pkcs11Sidecar.socketDir | quote }}
            {{- end }}
            {{- range $module := $svc.pkcs11Modules }}
            - name: {{ printf "pkcs11-module-%s" ($module.name | default "module") | trunc 63 | trimSuffix "-" }}
              mountPath: {{ $module.mountPath | default "/run/pkcs11-modules" | quote }}
              readOnly: true
            {{- end }}
            - name: golang-engine-storage
              mountPath: /crypto/fs
          ports:
            - containerPort: {{ $svc.port }}
      restartPolicy: Always
      {{- include "lamassu.podPlacement" (dict "svc" $svc) | nindent 6 }}
      volumes:
        - name: api-config
          configMap:
            name: {{ include "lamassu.componentName" (dict "root" $ "component" "kms-config") }}
        {{- if $svc.pkcs11Sidecar.enabled }}
        - name: pkcs11-socket
          emptyDir: {}
        {{- with $svc.pkcs11Sidecar.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- range $module := $svc.pkcs11Modules }}
        - name: {{ printf "pkcs11-module-%s" ($module.name | default "module") | trunc 63 | trimSuffix "-" }}
          emptyDir: {}
        {{- end }}
        {{- if not $hasFilesystemEngine }}
        - name: golang-engine-storage
          emptyDir: {}
        {{- end }}
  {{- if $hasFilesystemEngine }}
  volumeClaimTemplates:
    - metadata:
        name: golang-engine-storage
        labels:
          {{- include "lamassu.labels" (dict "root" $ "component" "kms") | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: null
        resources:
          requests:
            storage: 1Gi
  {{- end }}
