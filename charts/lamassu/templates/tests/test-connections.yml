apiVersion: v1
kind: Pod
metadata:
  name: {{ include "lamassu.componentName" (dict "root" $ "component" "connectivity-test") }}
  labels:
    {{- include "lamassu.labels" (dict "root" $ "component" "test") | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  serviceAccountName: {{ include "lamassu.serviceAccountName" . }}
  automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: hcheck
      image: {{ .Values.connectivityTest.image }}

      {{- with .Values.connectivityTest.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      command:
        - /bin/sh
        - -c

      args:
        - |
          check_service() {
              url="$1"

              if curl \
                  --max-time 10 \
                  --silent \
                  --show-error \
                  --fail \
                  --output /dev/null \
                  "$url"; then
                  echo "successfully validated $url"
              else
                  echo "health check failed for $url"
                  exit 1
              fi
          }

          check_ui() {
              url="$1"

              response=$(curl \
                  --max-time 10 \
                  --silent \
                  --show-error \
                  --fail \
                  "$url") || {
                      echo "health check failed for $url"
                      exit 1
                  }

              echo "$response" |
                  grep -q '<title>LamassuIoT Certificate Manager</title>' || {
                      echo "invalid UI response from $url"
                      exit 1
                  }

              echo "successfully validated $url"
          }

          check_service "http://{{ include "lamassu.componentName" (dict "root" $ "component" "ca") }}:{{ include "lamassu.config.servicePort" (dict "root" $ "svcKey" "ca") }}/health"
          check_service "http://{{ include "lamassu.componentName" (dict "root" $ "component" "dms-manager") }}:{{ include "lamassu.config.servicePort" (dict "root" $ "svcKey" "dmsManager") }}/health"
          check_service "http://{{ include "lamassu.componentName" (dict "root" $ "component" "device-manager") }}:{{ include "lamassu.config.servicePort" (dict "root" $ "svcKey" "deviceManager") }}/health"
          check_service "http://{{ include "lamassu.componentName" (dict "root" $ "component" "va") }}:{{ include "lamassu.config.servicePort" (dict "root" $ "svcKey" "va") }}/health"
          check_ui "http://{{ include "lamassu.componentName" (dict "root" $ "component" "ui") }}:{{ include "lamassu.config.servicePort" (dict "root" $ "svcKey" "ui") }}"

  restartPolicy: Never