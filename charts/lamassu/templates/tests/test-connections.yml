apiVersion: v1
kind: Pod
metadata:
  name: {{ include "lamassu.componentName" (dict "root" $ "component" "connectivity-test") }}
  labels:
    {{- include "lamassu.labels" (dict "root" $ "component" "test") | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  serviceAccountName: {{ include "lamassu.serviceAccountName" . }}
  automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: hcheck
      image: {{ .Values.toolbox.image }}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      command: ['bash']
      args: ["/etc/scripts/init.sh"]
      volumeMounts:
        - name: healthcheck-script
          mountPath: /etc/scripts/init.sh
          subPath: init.sh
  volumes:
  - name: healthcheck-script
    configMap:
      name: {{ include "lamassu.componentName" (dict "root" $ "component" "connectivity-test-script") }}
  restartPolicy: Never
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ include "lamassu.componentName" (dict "root" $ "component" "connectivity-test-script") }}
  labels:
    {{- include "lamassu.labels" (dict "root" $ "component" "test") | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
  init.sh: |
    #!/bin/bash
    function curl_or_exit() {
        response=$(curl -k -m 10 -sS --fail-early $1)
        if [ $? -ne 0 ]; then
            echo "curl failed for $1: exiting 1"
            exit 1
        fi

        echo "$response"
    }
    
    function curl_and_analyze_json() {
        response=$(curl_or_exit $1)

        # Check if response is valid JSON
        if ! jq empty <<< "$response" &>/dev/null; then
            echo "NO valid JSON found in the response for $1 serivce. exiting 1"
            exit 1
        fi

        echo "sucessfully validated $1"
    }
 
 
    function curl_and_analyze_ui() {
        ui_response=$(curl_or_exit $1)
        keyword="<title>LamassuIoT Certificate Manager</title>"
        if echo "$ui_response" | grep -q "$keyword"; then
            echo "sucessfully validated $1"
        else
            echo "NO valid response for $1. exiting 1"
            echo "$ui_response"
            exit 1
        fi
    }
    
    curl_and_analyze_json http://{{ include "lamassu.componentName" (dict "root" $ "component" "ca") }}:{{ include "lamassu.config.servicePort" (dict "root" $ "svcKey" "ca") }}/health
    curl_and_analyze_json http://{{ include "lamassu.componentName" (dict "root" $ "component" "dms-manager") }}:{{ include "lamassu.config.servicePort" (dict "root" $ "svcKey" "dmsManager") }}/health
    curl_and_analyze_json http://{{ include "lamassu.componentName" (dict "root" $ "component" "device-manager") }}:{{ include "lamassu.config.servicePort" (dict "root" $ "svcKey" "deviceManager") }}/health
    curl_and_analyze_json http://{{ include "lamassu.componentName" (dict "root" $ "component" "va") }}:{{ include "lamassu.config.servicePort" (dict "root" $ "svcKey" "va") }}/health

    #UI Health Check
    curl_and_analyze_ui http://{{ include "lamassu.componentName" (dict "root" $ "component" "ui") }}:{{ include "lamassu.config.servicePort" (dict "root" $ "svcKey" "ui") }}
