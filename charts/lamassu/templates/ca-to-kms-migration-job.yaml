{{- if .Values.migrations.caToKms.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "lamassu.componentName" (dict "root" $ "component" "ca-to-kms-migration") }}
  labels:
    {{- include "lamassu.labels" (dict "root" $ "component" "migration") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "lamassu.selectorLabels" (dict "root" $ "component" "migration") | nindent 8 }}
    spec:
      # Hook resources execute before regular chart resources are reconciled.
      automountServiceAccountToken: false
      {{- include "lamassu.globalImagePullSecrets" $ | nindent 6 }}
      securityContext:
        {{- toYaml .Values.serviceDefaults.podSecurityContext | nindent 8 }}
      restartPolicy: OnFailure
      containers:
        - name: ca-to-kms-migration
          image: {{ .Values.migrations.caToKms.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.serviceDefaults.securityContext | nindent 12 }}
          volumeMounts:
            - name: kms-config
              mountPath: /etc/lamassuiot/config.yml
              subPath: config
              readOnly: true
      volumes:
        - name: kms-config
          projected:
            sources:
              # Keep the release-scoped ConfigMap optional so upgrades from 3.8.0
              # can fall back to it after the legacy ConfigMap has been removed.
              - configMap:
                  name: {{ include "lamassu.componentName" (dict "root" $ "component" "kms-config") }}
                  optional: true
              # This one-time pre-upgrade migration also supports the ConfigMap
              # created by chart versions prior to release-scoped resource naming.
              # It is listed last so the legacy configuration remains authoritative
              # while it still exists; the scoped ConfigMap is used once it is gone.
              - configMap:
                  name: kms-config
                  optional: true
{{- end }}
