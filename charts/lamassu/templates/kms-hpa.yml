{{- $hasFilesystemEngine := include "kms.hasFilesystemEngine" . | eq "true" -}}
{{- $svc := include "lamassu.svc.merged" (dict "root" $ "svcKey" "kms") | fromYaml -}}
{{- if $svc.autoscaling.enabled }}
{{- include "lamassu.autoscaling.validate" (dict "name" "kms" "autoscaling" $svc.autoscaling) }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "lamassu.componentName" (dict "root" $ "component" "kms") }}
  {{- include "lamassu.resourceMetadata" (dict "root" $ "component" "kms") | nindent 2 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: {{ ternary "StatefulSet" "Deployment" $hasFilesystemEngine }}
    name: {{ include "lamassu.componentName" (dict "root" $ "component" "kms") }}
  minReplicas: {{ $svc.autoscaling.minReplicas }}
  maxReplicas: {{ $svc.autoscaling.maxReplicas }}
  metrics:
    {{- include "lamassu.autoscaling.metrics" $svc.autoscaling | nindent 4 }}
{{- end }}
