apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "lamassu.componentName" (dict "root" $ "component" "http-to-https") }}
  {{- include "lamassu.resourceMetadata" (dict "root" $ "component" "http-to-https") | nindent 2 }}
spec:
  parentRefs:
    - name: {{ include "lamassu.componentName" (dict "root" $ "component" "gateway") }}
      sectionName: http  # The specific listener
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301  # Permanent redirect
