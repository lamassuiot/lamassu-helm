apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ include "lamassu.componentName" (dict "root" $ "component" "proxy") }}
  {{- include "lamassu.resourceMetadata" (dict "root" $ "component" "proxy") | nindent 2 }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        allocateLoadBalancerNodePorts: false
        # Envoy Gateway defaults to Local, which drops traffic entering nodes
        # without a local proxy pod. Pin Cluster so the gateway IP is reachable
        # through any node.
        externalTrafficPolicy: Cluster
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "lamassu.componentName" (dict "root" $ "component" "gateway") }}
  {{- include "lamassu.resourceMetadata" (dict "root" $ "component" "gateway") | nindent 2 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: {{ include "lamassu.componentName" (dict "root" $ "component" "proxy") }}
  addresses:
  {{ range $ip := $.Values.gateway.addresses }}
  - type: IPAddress
    value: {{ $ip }}
  {{ end }}
  listeners:
    - name: http 
      protocol: HTTP
      port: {{ .Values.gateway.ports.http }}
    - name: https # Do not change. The EnvoyPatchPolicy is looking for this name to apply the patch.
      protocol: HTTPS
      port:  {{ .Values.gateway.ports.https }}
      tls:
        mode: Terminate
        certificateRefs:
        - kind: Secret
          group: ""
          name: {{ include "downstream.certSecret" . }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ include "lamassu.componentName" (dict "root" $ "component" "enable-mtls") }}
  {{- include "lamassu.resourceMetadata" (dict "root" $ "component" "gateway") | nindent 2 }}
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ include "lamassu.componentName" (dict "root" $ "component" "gateway") }}
  tls:
    maxVersion: "1.3"
    clientValidation: 
      optional: true
      mode: Request
  headers:
    earlyRequestHeaders:
      remove:
      - x-principal-id
      - x-lms-source
      - x-forwarded-client-cert
      - x-forwarded-cert
      - ssl-client-cert
      - x-amzn-mtls-clientcert
    xForwardedClientCert:
      mode: AppendForward
      certDetailsToAdd: 
      - Chain
