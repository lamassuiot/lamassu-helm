apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ include "lamassu.componentName" (dict "root" $ "component" "proxy") }}
  {{- include "lamassu.resourceMetadata" (dict "root" $ "component" "proxy") | nindent 2 }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        # Pinned so the Traefik front proxy's HTTPRoute can target this
        # Service by a stable name instead of discovering an autogenerated
        # one at install time (see traefik-front-proxy.yaml).
        name: {{ include "envoyGateway.serviceName" . }}
        # Declare the HTTPS listener port as TLS. Since Traefik v3.7.15
        # (traefik#13935) an HTTPRoute backend port without appProtocol is
        # dialed in plain HTTP, even on 443, so the Traefik front proxy would
        # get a 502 from this TLS listener.
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - port: {{ .Values.gateway.ports.https }}
                  appProtocol: https
        {{- if .Values.gateway.addresses }}
        allocateLoadBalancerNodePorts: false
        # Envoy Gateway defaults to Local, which drops traffic entering nodes
        # without a local proxy pod. Pin Cluster so the gateway IP is reachable
        # through any node.
        externalTrafficPolicy: Cluster
        {{- else }}
        # No gateway.addresses given: the Gateway isn't meant to be reached
        # directly (e.g. it sits behind the fast-lane Traefik front proxy).
        # Keep it ClusterIP-only so it doesn't wait forever on a LoadBalancer
        # address that no cloud controller will ever assign.
        # (allocateLoadBalancerNodePorts is only valid for type: LoadBalancer.)
        type: ClusterIP
        {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "lamassu.componentName" (dict "root" $ "component" "gateway") }}
  {{- include "lamassu.resourceMetadata" (dict "root" $ "component" "gateway") | nindent 2 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: {{ include "lamassu.componentName" (dict "root" $ "component" "proxy") }}
  {{- if $.Values.gateway.addresses }}
  addresses:
  {{- range $ip := $.Values.gateway.addresses }}
  - type: IPAddress
    value: {{ $ip }}
  {{- end }}
  {{- end }}
  listeners:
    - name: http 
      protocol: HTTP
      port: {{ .Values.gateway.ports.http }}
    - name: https # Do not change. The EnvoyPatchPolicy is looking for this name to apply the patch.
      protocol: HTTPS
      port:  {{ .Values.gateway.ports.https }}
      tls:
        mode: Terminate
        certificateRefs:
        - kind: Secret
          group: ""
          name: {{ include "downstream.certSecret" . }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ include "lamassu.componentName" (dict "root" $ "component" "enable-mtls") }}
  {{- include "lamassu.resourceMetadata" (dict "root" $ "component" "gateway") | nindent 2 }}
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ include "lamassu.componentName" (dict "root" $ "component" "gateway") }}
  tls:
    maxVersion: "1.3"
    clientValidation: 
      optional: true
      mode: Request
  headers:
    earlyRequestHeaders:
      remove:
      - x-principal-id
      - x-lms-source
      - x-forwarded-client-cert
      - x-forwarded-cert
      - ssl-client-cert
      - x-amzn-mtls-clientcert
    xForwardedClientCert:
      mode: AppendForward
      certDetailsToAdd: 
      - Chain
