{{ range $connectorID, $instance := $.Values.services.connectors }}
{{- if eq $instance.type "awsiot" }}
{{- $instanceID := $connectorID | replace "aws." "" }}
{{- $component := printf "aws-connector-%s" $instanceID }}
{{- $svc := include "lamassu.svc.merged" (dict "root" $ "svc" $instance) | fromYaml }}
{{- $config := include "lamassu.awsConnector.config" (dict "root" $ "connectorID" $connectorID "instance" $instance) }}
{{- $resourceName := include "lamassu.componentName" (dict "root" $ "component" $component) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $resourceName }}
  {{- include "lamassu.workloadMetadata" (dict "root" $ "name" $component "svc" $svc) | nindent 2 }}
spec:
  {{- if not $svc.autoscaling.enabled }}
  replicas: {{ $svc.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "lamassu.selectorLabels" (dict "root" $ "component" $component) | nindent 6 }}
  template:
    metadata:
      {{- include "lamassu.podMetadata" (dict "root" $ "name" $component "svc" $svc "configData" $config) | nindent 6 }}
    spec:
      serviceAccountName: {{ include "lamassu.serviceAccountName" $ }}
      automountServiceAccountToken: {{ $.Values.serviceAccount.automountServiceAccountToken }}
      {{- with $svc.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "lamassu.podSecurityContext" (dict "root" $ "svc" $svc) | nindent 6 }}
      containers:
        - name: {{ $component }}
          image: {{ $svc.image }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy | quote }}
          {{- with $svc.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $svc.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $svc.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $svc.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # The connector only consumes events and calls the Lamassu APIs: it
          # listens on no port, so it has no Service, containerPort or HTTP
          # probes. A fatal error exits the process and the pod restarts.
          {{- with $svc.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: api-config
              mountPath: /etc/lamassuiot/config.yml
              subPath: config
            {{- include "lamassu.amqpVolumeMounts" $ | nindent 12 }}
      restartPolicy: Always
      {{- include "lamassu.podPlacement" (dict "svc" $svc) | nindent 6 }}
      volumes:
        - name: api-config
          configMap:
            name: {{ include "lamassu.componentName" (dict "root" $ "component" (printf "%s-config" $component)) }}
        {{- include "lamassu.amqpVolumes" $ | nindent 8 }}
---
{{- end -}}
{{- end -}}
