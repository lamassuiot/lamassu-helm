{{- $svc := include "lamassu.svc.merged" (dict "root" $ "svcKey" "dmsManager") | fromYaml -}}
{{- if eq (include "lamassu.pdb.enabled" $svc) "true" }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "lamassu.componentName" (dict "root" $ "component" "dms-manager") }}
  {{- include "lamassu.resourceMetadata" (dict "root" $ "component" "dms-manager") | nindent 2 }}
spec:
  minAvailable: {{ $svc.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "lamassu.selectorLabels" (dict "root" $ "component" "dms-manager") | nindent 6 }}
{{- end }}
