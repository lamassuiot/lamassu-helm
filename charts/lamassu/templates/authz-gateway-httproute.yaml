{{- $svc := include "lamassu.svc.merged" (dict "root" $ "svcKey" "authz") | fromYaml -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "lamassu.componentName" (dict "root" $ "component" "api-authz") }}
  {{- include "lamassu.resourceMetadata" (dict "root" $ "component" "api-authz") | nindent 2 }}
spec:
  parentRefs:
    {{- include "lamassu.gatewayParentRef" (dict "root" $) | nindent 4 }}
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /api/authz/
      filters:
      - type: URLRewrite
        urlRewrite:
          path:
            type: ReplacePrefixMatch
            replacePrefixMatch: /
      backendRefs:
        - name: {{ include "lamassu.componentName" (dict "root" $ "component" "authz") }}
          port: {{ $svc.port }}
