{{- if .Values.services.wfx.enabled }}
{{- $svc := include "lamassu.svc.merged" (dict "root" $ "svcKey" "wfx") | fromYaml -}}
{{- if $svc.autoscaling.enabled }}
{{- include "lamassu.autoscaling.validate" (dict "name" "wfx" "autoscaling" $svc.autoscaling) }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "lamassu.componentName" (dict "root" $ "component" "wfx") }}
  {{- include "lamassu.resourceMetadata" (dict "root" $ "component" "wfx") | nindent 2 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "lamassu.componentName" (dict "root" $ "component" "wfx") }}
  minReplicas: {{ $svc.autoscaling.minReplicas }}
  maxReplicas: {{ $svc.autoscaling.maxReplicas }}
  metrics:
    {{- include "lamassu.autoscaling.metrics" $svc.autoscaling | nindent 4 }}
{{- end }}
{{- end }}
