{{- $svc := include "lamassu.svc.merged" (dict "root" $ "svcKey" "va") | fromYaml -}}
kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ include "lamassu.componentName" (dict "root" $ "component" "va-config") }}
  {{- include "lamassu.resourceMetadata" (dict "root" $ "component" "va") | nindent 2 }}
data:
  config: |
    {{- include "lamassu.config.header" (dict "logsLevel" "info" "port" $svc.port) | nindent 4 }}

    {{- if eq .Values.services.va.fileStore.type "local" }}
    filesystem_storage:
      id: "{{ .Values.services.va.fileStore.id }}"
      type: "{{ .Values.services.va.fileStore.type }}"
      storage_directory: "{{ .Values.services.va.fileStore.local.storageDirectory }}"
    {{- else if eq .Values.services.va.fileStore.type "s3" }}
    filesystem_storage:
      id: "{{ .Values.services.va.fileStore.id }}"
      type: "{{ .Values.services.va.fileStore.type }}"
      {{- toYaml (.Values.services.va.fileStore.s3 | default dict) | nindent 6 }}
    {{- end }}

    crl_monitoring_job:
      enabled: true
      frequency: "{{ .Values.services.va.job.crl.frequency }}"

    va_domains:
    {{ range $.Values.services.ca.domains }}
      - "{{ . }}/api/va"
    {{ end }}
    {{- include "lamassu.config.eventbus" (dict "root" $ "key" "subscriber_event_bus") | nindent 4 }}

    {{- include "lamassu.config.eventbus" (dict "root" $ "key" "subscriber_dlq_event_bus" "dlq" true) | nindent 4 }}

    {{- include "lamassu.config.eventbus" (dict "root" $ "key" "publisher_event_bus") | nindent 4 }}

    {{- include "lamassu.config.storage" $ | nindent 4 }}

    kms_client:
      log_level: debug
      auth_mode: noauth
      protocol: http
      hostname: {{ include "lamassu.componentName" (dict "root" $ "component" "kms") }}
      port: {{ include "lamassu.config.servicePort" (dict "root" $ "svcKey" "kms") }}

    ca_client:
      log_level: debug
      auth_mode: "noauth"
      protocol: "http"
      hostname: {{ include "lamassu.componentName" (dict "root" $ "component" "ca") | quote }}
      port: {{ include "lamassu.config.servicePort" (dict "root" $ "svcKey" "ca") }}
    {{- include "lamassu.config.authzClient" $ | nindent 4 }}
    {{- include "lamassu.config.otel" $ | nindent 4 }}
