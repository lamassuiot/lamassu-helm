{{- $svc := include "lamassu.svc.merged" (dict "root" $ "svcKey" "alerts") | fromYaml -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lamassu.componentName" (dict "root" $ "component" "alerts") }}
  {{- include "lamassu.resourceMetadata" (dict "root" $ "component" "alerts") | nindent 2 }}
spec:
  selector:
    {{- include "lamassu.selectorLabels" (dict "root" $ "component" "alerts") | nindent 4 }}
  type: ClusterIP
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
      protocol: TCP
