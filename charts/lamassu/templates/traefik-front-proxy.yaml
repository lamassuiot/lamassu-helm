{{- if .Values.traefikFrontProxy.enabled }}
{{- if eq .Values.traefikFrontProxy.tls.type "certManager" }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: edge-tls-certificate
  namespace: {{ .Release.Namespace }}
spec:
  isCA: false
  commonName: {{ .Values.traefikFrontProxy.domain | quote }}
  dnsNames:
  - {{ .Values.traefikFrontProxy.domain | quote }}
  {{- if .Values.traefikFrontProxy.tls.certManagerOptions.addresses }}
  ipAddresses:
    {{- range .Values.traefikFrontProxy.tls.certManagerOptions.addresses }}
    - {{ . }}
    {{- end }}
  {{- end }}
  duration: "2160h"
  secretName: edge-cert
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: "Always"
  issuerRef:
    kind: Issuer
    name: {{ include "lamassu.componentName" (dict "root" $ "component" "downstream-ca-selfsigned-issuer") }}
    group: cert-manager.io
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-traefik-to-envoy-{{ .Release.Namespace }}
  namespace: envoy-gateway-system
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: {{ .Release.Namespace }}
  to:
  - group: ""
    kind: Service
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik-gw
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: traefik
  listeners:
  - name: https
    protocol: HTTPS
    port: {{ .Values.traefikFrontProxy.webSecurePort }}
    tls:
      mode: Terminate
      # Use the cluster-wide default TLSOption (key exchange groups, client
      # certificates) instead of Traefik's isolated per-listener defaults.
      # Honored by ghcr.io/lamassuiot/traefik:pqc-3.7.15, ignored elsewhere.
      options:
        traefik.io/tls-options: default
      certificateRefs:
      {{- with .Values.traefikFrontProxy.tls }}
      {{- if and (eq .type "none") (empty .additionalSecretNames) }}
      {{- fail "traefikFrontProxy.tls.type=none requires at least one traefikFrontProxy.tls.additionalSecretNames entry" }}
      {{- end }}
      {{- if ne .type "none" }}
      - kind: Secret
        group: ""
        name: {{ ternary .externalOptions.secretName "edge-cert" (eq .type "external") }}
      {{- end }}
      {{- range .additionalSecretNames }}
      - kind: Secret
        group: ""
        name: {{ . }}
      {{- end }}
      {{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: inject-client-cert
  namespace: {{ .Release.Namespace }}
spec:
  passTLSClientCert:
    pem: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: proxy-to-envoy
  namespace: {{ .Release.Namespace }}
spec:
  hostnames:
  - {{ .Values.traefikFrontProxy.domain | quote }}
  parentRefs:
  - name: traefik-gw
    namespace: {{ .Release.Namespace }}
    sectionName: https
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: {{ include "envoyGateway.serviceName" . }}
      namespace: envoy-gateway-system
      port: 443
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        set:
        - name: X-Forwarded-Proto
          value: https
    - type: ExtensionRef
      extensionRef:
        group: traefik.io
        kind: Middleware
        name: inject-client-cert
{{- end }}
