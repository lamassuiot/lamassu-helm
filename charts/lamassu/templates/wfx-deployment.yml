{{- if .Values.services.wfx.enabled }}
{{- $svc := include "lamassu.svc.merged" (dict "root" $ "svcKey" "wfx") | fromYaml -}}
{{- $resourceName := include "lamassu.componentName" (dict "root" $ "component" "wfx") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $resourceName }}
  {{- include "lamassu.workloadMetadata" (dict "root" $ "name" "wfx" "svc" $svc) | nindent 2 }}
spec:
  {{- if not $svc.autoscaling.enabled }}
  replicas: {{ $svc.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "lamassu.selectorLabels" (dict "root" $ "component" "wfx") | nindent 6 }}
  template:
    metadata:
      {{- include "lamassu.podMetadata" (dict "root" $ "name" "wfx" "svc" $svc) | nindent 6 }}
    spec:
      serviceAccountName: {{ include "lamassu.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with $svc.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $svc.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: wfx
          image: {{ $svc.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy | quote }}
          # Override flags baked into the image entrypoint so both APIs bind to
          # their configured ports.
          {{- with $svc.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - {{ printf "--client-host=http://0.0.0.0:%v" $svc.clientPort | quote }}
            - {{ printf "--mgmt-host=http://0.0.0.0:%v" $svc.managementPort | quote }}
            {{- range $svc.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- with $svc.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: WFX_STORAGE
              value: "postgres"
            - name: WFX_LOG_FORMAT
              value: {{ $svc.logs.format | quote }}
            - name: WFX_LOG_LEVEL
              value: {{ $svc.logs.level | quote }}
            - name: PGHOST
              value: {{ .Values.postgres.hostname | quote }}
            - name: PGPORT
              value: {{ .Values.postgres.port | quote }}
            - name: PGUSER
              value: {{ .Values.postgres.username | quote }}
            - name: PGPASSWORD
              value: {{ .Values.postgres.password | quote }}
            - name: PGDATABASE
              value: {{ $svc.postgres.database | quote }}
            - name: PGSSLMODE
              value: {{ $svc.postgres.sslmode | quote }}
            {{- with $svc.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- include "lamassu.tcpProbe" (dict "name" "livenessProbe" "probe" $svc.livenessProbe "port" $svc.clientPort) | nindent 10 }}
          {{- include "lamassu.tcpProbe" (dict "name" "readinessProbe" "probe" $svc.readinessProbe "port" $svc.clientPort) | nindent 10 }}
          {{- include "lamassu.tcpProbe" (dict "name" "startupProbe" "probe" $svc.startupProbe "port" $svc.clientPort) | nindent 10 }}
          {{- with $svc.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: client
              containerPort: {{ $svc.clientPort }}
            - name: management
              containerPort: {{ $svc.managementPort }}
      restartPolicy: Always
      {{- include "lamassu.podPlacement" (dict "svc" $svc) | nindent 6 }}
{{- end }}
