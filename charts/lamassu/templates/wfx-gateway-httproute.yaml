{{- if and .Values.services.wfx.enabled .Values.services.wfx.routing.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "lamassu.componentName" (dict "root" $ "component" "api-wfx-sbi") }}
  labels:
    {{- include "lamassu.labels" (dict "root" $ "component" "api-wfx-sbi") | nindent 4 }}
    auth: "external"
spec:
  parentRefs:
    - name: {{ include "lamassu.componentName" (dict "root" $ "component" "gateway") }}
      sectionName: https  # The specific listener
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: {{ .Values.services.wfx.routing.sbiPath }}
      filters:
      - type: URLRewrite
        urlRewrite:
          path:
            type: ReplacePrefixMatch
            replacePrefixMatch: {{ default .Values.services.wfx.routing.rewritePath .Values.services.wfx.routing.rewriteSbiPath | quote }}
      backendRefs:
        - name: {{ include "lamassu.componentName" (dict "root" $ "component" "wfx") }}
          port: {{ .Values.services.wfx.clientPort }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "lamassu.componentName" (dict "root" $ "component" "api-wfx-nbi") }}
  labels:
    {{- include "lamassu.labels" (dict "root" $ "component" "api-wfx-nbi") | nindent 4 }}
    auth: "external"
spec:
  parentRefs:
    - name: {{ include "lamassu.componentName" (dict "root" $ "component" "gateway") }}
      sectionName: https  # The specific listener
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: {{ .Values.services.wfx.routing.nbiPath }}
      filters:
      - type: URLRewrite
        urlRewrite:
          path:
            type: ReplacePrefixMatch
            replacePrefixMatch: {{ default .Values.services.wfx.routing.rewritePath .Values.services.wfx.routing.rewriteNbiPath | quote }}
      backendRefs:
        - name: {{ include "lamassu.componentName" (dict "root" $ "component" "wfx") }}
          port: {{ .Values.services.wfx.managementPort }}
{{- end }}
