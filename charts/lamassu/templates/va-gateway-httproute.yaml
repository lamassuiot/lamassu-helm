{{- $svc := include "lamassu.svc.merged" (dict "root" $ "svcKey" "va") | fromYaml -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "lamassu.componentName" (dict "root" $ "component" "api-va") }}
  {{- include "lamassu.resourceMetadata" (dict "root" $ "component" "api-va") | nindent 2 }}
spec:
  parentRefs:
    {{- include "lamassu.gatewayParentRef" (dict "root" $ "sections" (list "http" "https")) | nindent 4 }}
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /api/va/
      filters:
      - type: URLRewrite
        urlRewrite:
          path:
            type: ReplacePrefixMatch
            replacePrefixMatch: /
      backendRefs:
        - name: {{ include "lamassu.componentName" (dict "root" $ "component" "va") }}
          port: {{ $svc.port }}
