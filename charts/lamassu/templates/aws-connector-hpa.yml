{{- range $connectorID, $instance := $.Values.services.connectors }}
{{- if eq $instance.type "awsiot" }}
{{- $instanceID := $connectorID | replace "aws." "" }}
{{- $component := printf "aws-connector-%s" $instanceID }}
{{- $svc := include "lamassu.svc.merged" (dict "root" $ "svc" $instance) | fromYaml }}
{{- if $svc.autoscaling.enabled }}
{{- include "lamassu.autoscaling.validate" (dict "name" $component "autoscaling" $svc.autoscaling) }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "lamassu.componentName" (dict "root" $ "component" $component) }}
  {{- include "lamassu.resourceMetadata" (dict "root" $ "component" $component) | nindent 2 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "lamassu.componentName" (dict "root" $ "component" $component) }}
  minReplicas: {{ $svc.autoscaling.minReplicas }}
  maxReplicas: {{ $svc.autoscaling.maxReplicas }}
  metrics:
    {{- include "lamassu.autoscaling.metrics" $svc.autoscaling | nindent 4 }}
---
{{- end }}
{{- end }}
{{- end }}
