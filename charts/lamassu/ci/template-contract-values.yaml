# Exercises non-default ports and autoscaling branches during chart-testing.

postgres:
  hostname: "postgresql"
  port: 5432
  username: "admin"
  password: "admin"

amqp:
  hostname: "rabbitmq"
  port: 5672
  username: "admin"
  password: "admin"

auth:
  oidc:
    frontend:
      authority: https://ci.lamassu.io/auth/realms/lamassu

gateway:
  extraRouting:
    - path: /auth
      name: auth
      target:
        host: auth-keycloak
        port: 80  # If no sidecar is used
  ports:
    http: 80
    https: 443
  addresses:

services:
  ca:
    port: 9999
  kms:
    port: 9998
  authz:
    port: 9997
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
  wfx:
    clientPort: 9082
    managementPort: 9083
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
  connectors:
    aws.contract:
      type: awsiot
      image: ghcr.io/lamassuiot/lamassu-aws-connector:dev-v4
      credentials:
        auth_method: default
        region: eu-west-1
      autoscaling:
        enabled: true
        minReplicas: 2
        maxReplicas: 3
