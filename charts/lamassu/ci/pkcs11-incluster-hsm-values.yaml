postgres:
  hostname: "postgresql"
  port: 5432
  username: "admin"
  password: "admin"

amqp:
  hostname: "rabbitmq"
  port: 5672
  username: "admin"
  password: "admin"

auth:
  oidc:
    frontend:
      authority: https://ci.lamassu.io/auth/realms/lamassu

gateway:
  extraRouting:
    - path: /auth
      name: auth
      target:
        host: auth-keycloak
        port: 80  # If no sidecar is used
  ports:
    http: 80
    https: 443
  addresses:

services:
  kms:
    # No command/args override here: the PKCS#11 sidecar init container below
    # defines its own readinessProbe (checking the forwarded socket exists),
    # and Kubernetes' native-sidecar semantics (1.29+) already block the main
    # "kms" container from starting until that readinessProbe passes. A
    # command/args wait-loop on the main container would be redundant on top
    # of that guarantee, and can't work at all on images without a shell
    # (e.g. ghcr.io/lamassuiot/lamassu-kms:dev).
    # No podSecurityContext override needed: the chart-wide 65532:65532 default
    # already matches the UID the PKCS#11 sidecar forwards its socket under.
    pkcs11Sidecar:
      enabled: true
      image: ghcr.io/lamassuiot/p11-kit-ssh-sidecar:latest
      imagePullPolicy: IfNotPresent
      socketDir: /run/p11-kit
      env:
        - name: SSH_DESTINATION
          value: root@hsm-softhsm
        - name: SSH_IDENTITY_FILE
          value: /etc/p11-kit-ssh/.key
        - name: P11_LOCAL_SOCKET
          value: /run/p11-kit/pkcs11
        - name: P11_REMOTE_SOCKET
          value: /run/p11-kit/pkcs11
      volumeMounts:
        - name: kms-pkcs11-ssh-key
          mountPath: /etc/p11-kit-ssh
          readOnly: true
      volumes:
        - name: kms-pkcs11-ssh-key
          secret:
            secretName: kms-pkcs11-sidecar-ssh-key
    pkcs11Modules:
      # p11-kit-client.so is not bundled in the KMS image, so it is staged into a
      # shared, read-only volume by a short-lived init container instead.
      - name: p11-kit-client
        image: debian:12-slim
        imagePullPolicy: IfNotPresent
        mountPath: /run/p11-kit-modules
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
          capabilities:
            drop:
              - ALL
            add:
              - CHOWN
              - DAC_OVERRIDE
              - FOWNER
              - SETGID
              - SETUID
        command:
          - /bin/sh
        args:
          - -ec
          - |
            set -eu
            TARGET_DIR="${PKCS11_MODULE_DIR:-/run/p11-kit-modules}"
            mkdir -p "${TARGET_DIR}"
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends p11-kit-modules
            MOD="$(dpkg -L p11-kit-modules | grep -m1 '/p11-kit-client\.so$')"
            [ -n "${MOD}" ] || { echo "p11-kit-client.so not found" >&2; exit 1; }
            cp -L "${MOD}" "${TARGET_DIR}/p11-kit-client.so"
            ldd "${MOD}" | sed -n 's/.*=> \(\/[^ ]*\).*/\1/p' | while read -r lib; do
              case "${lib}" in
                */libc.so*|*/libm.so*|*/libpthread.so*|*/libdl.so*|*/librt.so*|*/ld-linux*) continue ;;
              esac
              cp -L "${lib}" "${TARGET_DIR}/" 2>/dev/null || true
            done
            chmod -R 0555 "${TARGET_DIR}"
    cryptoEngines:
      defaultEngineID: pkcs11-1
      engines:
        - id: pkcs11-1
          type: pkcs11
          token: "lamassuHSM"
          pin: "1234"
          module_path: "/run/p11-kit-modules/p11-kit-client.so"
          module_extra_options:
            env:
              P11_KIT_SERVER_ADDRESS: "unix:path=/run/p11-kit/pkcs11"
              LD_LIBRARY_PATH: "/run/p11-kit-modules"
