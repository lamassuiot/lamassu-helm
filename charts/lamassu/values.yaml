global:
  ## ref: https://kubernetes.io/docs/concepts/containers/images/#pre-pulled-images
  ##
  imagePullPolicy: Always
  # -- Image pull secrets applied to every Lamassu pod.
  imagePullSecrets: []
# -- Partially override the name used for release-scoped resources.
nameOverride: ""
# -- Fully override the release-scoped resource-name prefix.
fullnameOverride: ""
# -- Labels added to every chart-managed object. Selector labels remain chart controlled.
commonLabels: {}
# -- Annotations added to every chart-managed object.
commonAnnotations: {}
serviceAccount:
  # -- Create a dedicated ServiceAccount for Lamassu workloads.
  create: true
  # -- ServiceAccount name. Defaults to the release-scoped chart name when create=true, otherwise default.
  name: ""
  # -- Annotations added to the generated ServiceAccount.
  annotations: {}
  # -- Mount the Kubernetes API token into Lamassu pods.
  automountServiceAccountToken: false
# Downstream TLS (API Gateway)
tls:
  # -- TLS certificate provider to use for the API Gateway. Allowed values are: `certManager`, `external`
  type: certManager
  certManagerOptions:
    # -- CertManager ClusterIssuer to use to sign the certificate for the API Gateway.
    clusterIssuer: ""
    # -- CertManager Issuer to use to sign the certificate for the API Gateway. Ignored if `clusterIssuer` is set. If left empty, a self signed certificate will be used.
    issuer: ""
    # -- Duration for the certificate to be valid
    certSpec:
      commonName: "dev.lamassu.io"
      hostnames:
        - "dev.lamassu.io"
      addresses:
      # -- 2160h == 90days
      duration: "2160h"
  externalOptions:
    # -- Secret name for the TLS certificate to be used for the API Gateway (the secret at least must have `tls.crt` and `tls.key` keys)
    secretName: ""
gateway:
  # -- GatewayClass used by the generated Gateway.
  className: eg
  extraRouting:
  addresses:
  ports:
    http: 80
    https: 443
  responseOverride:
    # -- Rewrite 401 responses with a custom body
    unauthorized:
      enabled: true
      contentType: application/json
      body: '{"error": "Unauthorized"}'
    # -- Rewrite 403 responses with a custom body
    forbidden:
      enabled: true
      contentType: application/json
      body: '{"error": "Forbidden"}'
postgres:
  # -- Hostname for the PostgreSQL server
  hostname: ""
  # -- Port for the PostgreSQL server
  port: 5432
  # -- Log level used by components that connect to PostgreSQL for their storage layer
  logLevel: "info"
  # -- Username to be used to authenticate with the PostgreSQL server
  username: ""
  # -- Password to be used to authenticate with the PostgreSQL server
  password: ""
amqp:
  # -- Hostname for the AMQP server
  hostname: ""
  # -- Port for the AMQP server
  port: 5672
  # -- Username to be used to authenticate with the AMQP server
  username: ""
  # -- Password to be used to authenticate with the AMQP server
  password: ""
  # -- Enable AMQP over TLS (aka AMPQS)
  tls: false
observability:
  # -- Enable OpenTelemetry instrumentation for all Lamassu services
  enabled: false
  # -- HTTP routes for the observability UIs exposed through the API Gateway
  routes:
    logs:
      # -- Path prefix at which Victoria Logs UI is exposed through the gateway
      path: /infra/logs
      # -- Backend service for the Victoria Logs UI (vmui)
      hostname: "victoria-logs"
      # -- Backend port for the Victoria Logs UI
      port: 9428
    traces:
      # -- Path prefix at which VictoriaTraces UI is exposed through the gateway
      path: /infra/traces
      # -- Backend service for the VictoriaTraces UI (vmui)
      hostname: "victoria-traces"
      # -- Backend port for the VictoriaTraces UI
      port: 10428
    jaeger:
      # -- Path prefix at which the Jaeger UI is exposed through the gateway (must match the Jaeger query base_path)
      path: /infra/jaeger
      # -- Backend service for the Jaeger query UI
      hostname: "jaeger"
      # -- Backend port for the Jaeger query UI
      port: 16686
  traces:
    # -- Hostname of the OTLP HTTP collector that fans out traces to Jaeger and VictoriaTraces (deployed by --otel fastlane flag)
    hostname: "otel-collector"
    # -- OTLP HTTP port exposed by the OTel Collector
    port: 4318
    # -- Scheme for the OTLP traces endpoint (http | https)
    scheme: http
    # -- Base path for the OTLP traces ingestion endpoint (empty = standard /v1/traces)
    basePath: ""
  logs:
    # -- Hostname of the Victoria Logs OTLP HTTP endpoint (deployed by --otel fastlane flag)
    hostname: "victoria-logs"
    # -- OTLP HTTP port exposed by Victoria Logs
    port: 9428
    # -- Scheme for the Victoria Logs OTLP endpoint (http | https)
    scheme: http
    # -- Base path for the Victoria Logs OTLP log ingestion endpoint
    basePath: "/insert/opentelemetry/v1/logs"
auth:
  oidc:
    frontend:
      # -- Client ID to be used as the OIDC client for the frontend
      clientId: "frontend"
      # -- URL pointing to the OIDC provider's base path to build the OIDC well-known URL (This is the complete URL preceding the "/.well-known/openid-configuration" URL). Can be a JS expression
      authority: https://${window.location.host}/auth/realms/lamassu
    apiGateway:
      # -- URL pointing to the issuer's public key set to validate the JWT tokens.
      jwks:
        - name: oidc-authn
          # -- URI to use to fetch the public key set
          uri: http://keycloak/auth/realms/lamassu/protocol/openid-connect/certs
  authorization:
    # -- Claim to use to find and filter the user's roles
    rolesClaim: realm_access.roles
    roles:
      # -- Role association to be used to authorize the user as LAMASSU's admin
      admin: pki-admin
  externalAuthorization:
    # -- Protect routes labeled auth=external with Envoy Gateway external authorization.
    enabled: true
    # -- Kubernetes Service name for the external authorization endpoint. Empty uses the release-scoped authz Service.
    serviceName: ""
    # -- Kubernetes Service port for the external authorization endpoint. Defaults to the effective services.authz.port.
    servicePort:
    # -- HTTP path that replaces the original request path for the external authorization check. Requires Envoy Gateway v1.8.0+.
    path: /v1/ext_authz/check
    # -- Allow traffic when the external authorization service cannot be reached.
    failOpen: false
# -- Generic defaults applied to every Lamassu service (ca, kms, va, ui, alerts,
# deviceManager, dmsManager, authz, wfx and aws connector instances). Any key here can be
# overridden per service under `services.<name>` — the per-service block is
# deep-merged on top of these defaults. Maps are merged key by key; lists
# (tolerations, topologySpreadConstraints, extraEnv, ...) replace the default
# wholesale.
serviceDefaults:
  # -- HTTP port the service listens on (also used for Service, probes and gateway routes)
  port: 8085
  # -- Number of replicas. Ignored when autoscaling is enabled.
  replicaCount: 1
  # -- Container resource requests/limits. CPU and memory requests are required
  # for utilization-based HPA metrics.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # -- Extra annotations for the Deployment/StatefulSet
  annotations: {}
  # -- Extra labels for the Deployment/StatefulSet and its pods (added next to the `app` label)
  labels: {}
  # -- Extra labels for the pods only
  podLabels: {}
  # -- Extra annotations for the pods
  podAnnotations: {}
  # -- Node selector for pod scheduling
  nodeSelector: {}
  # -- Tolerations for pod scheduling
  tolerations: []
  # -- Additional image pull secrets for this service.
  imagePullSecrets: []
  # -- Pod-level security context.
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  # -- Container-level security context. Owned distroless images run with their
  # declared non-root UID/GID. Override per service (or per connector instance)
  # when a custom image declares a different identity.
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL
  # -- Extra environment variables for the service container
  extraEnv: []
  livenessProbe:
    # -- Enable the liveness probe.
    enabled: true
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
  readinessProbe:
    # -- Enable the readiness probe.
    enabled: true
    path: /health
    initialDelaySeconds: 3
    periodSeconds: 5
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
  startupProbe:
    # -- Enable the startup probe so liveness checks do not kill slow-starting services.
    enabled: true
    path: /health
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 60
  autoscaling:
    # -- Enable a HorizontalPodAutoscaler for the service
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetMemoryUtilizationPercentage: 80
    targetCPUUtilizationPercentage: 80
  # -- Pod affinity configuration.
  affinity: {}
  # -- Topology spread constraints.
  topologySpreadConstraints: []
  pdb:
    # -- minAvailable for PodDisruptionBudget. Only active when effective replica count > 1.
    minAvailable: 1
services:
  ui:
    # -- Docker image for the UI component
    image: "ghcr.io/lamassuiot/lamassu-ui:dev"
    # The rootless image listens on the chart-wide unprivileged service port.
    port: 8085
  va:
    # -- Docker image for the VA component. Replicas must stay at 1 while fileStore.type is "local" (ReadWriteOnce PVC).
    image: ghcr.io/lamassuiot/lamassu-va:dev-v4
    autoscaling:
      maxReplicas: 3
    fileStore:
      # -- Unique identifier for this storage engine instance
      id: "local-1"
      # -- Storage backend type  Allowed values: local | s3
      type: "local"
      # -- Config for type=local. Maps to localfs.FilesystemEngineConfig (storage_directory)
      local:
        storageDirectory: "/data/crl"
      # -- Config for type=s3. Free-form map whose keys map directly to s3.AWSS3FilesystemConfig
      s3:
    job:
      crl:
        # -- Frequency to launch the CRL computation job
        frequency: "0 * * * *"
  ca:
    # -- Domain to be used while signing/generating new CAs and certificates
    domains:
      - dev.lamassu.io
    # -- Docker image for the CA component
    image: ghcr.io/lamassuiot/lamassu-ca:dev-v4
    monitoring:
      # -- Frequency to check the CA's health status uses CRON syntax. Can also be specified at a "second" level by adding one extra term
      frequency: "* * * * *"
  kms:
    # -- Docker image for the KMS component. Replicas must stay at 1 while the filesystem crypto engine is configured (ReadWriteOnce PVC).
    image: ghcr.io/lamassuiot/lamassu-kms:dev-v4
    autoscaling:
      maxReplicas: 3
    # -- Optional command override for the KMS container
    command: []
    # -- Optional arguments override for the KMS container
    args: []
    pkcs11Sidecar:
      # -- Deploy a sidecar that creates a PKCS#11 socket on a shared volume for KMS.
      # -- Requires Kubernetes 1.29+ due to native sidecar initContainer semantics.
      enabled: false
      # -- Sidecar image used to create the forwarded PKCS#11 socket
      image: ""
      # -- Image pull policy for the PKCS#11 sidecar
      imagePullPolicy: IfNotPresent
      # -- Security context for the PKCS#11 sidecar. Defaults to KMS's own
      #    securityContext (65532:65532); the forwarded mode-0660 Unix socket
      #    is accessible to KMS through the pod's fsGroup.
      securityContext: {}
      # -- Shared directory where the sidecar should create the PKCS#11 socket
      socketDir: /run/p11-kit
      # -- Command for the PKCS#11 sidecar
      command: []
      # -- Arguments for the PKCS#11 sidecar
      args: []
      # -- Extra environment variables for the PKCS#11 sidecar
      env: []
      # -- Extra sidecar volume mounts, for example SSH key secrets
      volumeMounts: []
      # -- Extra pod volumes needed by the PKCS#11 sidecar
      volumes: []
      # -- Resource requests and limits for the PKCS#11 sidecar
      resources: {}
    # -- Optional PKCS#11 modules to inject into KMS at runtime. Each entry runs a
    #    short-lived init container that stages a module and optional config in a
    #    shared volume mounted read-only into KMS. Fields: name (unique), image,
    #    imagePullPolicy, securityContext, command, args, env, and mountPath.
    pkcs11Modules: []
    cryptoEngines:
      # -- Default engine ID to be used for the KMS component
      defaultEngineID: "filesystem-1"
      engines:
        - id: "filesystem-1"
          # filesystem | pkcs11 | hashicorp_vault | aws_kms | aws_secrets_manager
          type: "filesystem"
          metadata:
            prod-ready: "false"
          storage_directory: "/crypto/fs"
  deviceManager:
    # -- Docker image for the Device Manager component
    image: ghcr.io/lamassuiot/lamassu-devmanager:dev-v4
  dmsManager:
    # -- Docker image for the DMS Manager component
    image: ghcr.io/lamassuiot/lamassu-dmsmanager:dev-v4
    podSecurityContext:
      # -- Filesystem group that lets the cert-bundle init container and DMS container share generated certificates.
      fsGroup: 65532
    tlsInitContainer:
      # -- Image for the container that builds the downstream CA bundle.
      image: busybox:1.37
      # -- Security context for the container that builds the downstream CA bundle.
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        readOnlyRootFilesystem: false
        capabilities:
          drop:
            - ALL
  wfx:
    # -- Enable the Siemens WFX workflow service
    enabled: true
    # -- Docker image for the WFX component, pinned by digest for immutability.
    #    The image declares UID 65532, so it runs under the chart-wide 65532:65532,
    #    non-root default (see SECURITY.md).
    image: ghcr.io/siemens/wfx@sha256:a4c369a086ee82828c3858f2c330b4cb1762d7ae2830a4cb5aba56830d86f678
    # -- WFX command override. The explicit command avoids conflicting flags baked into the image entrypoint.
    command:
      - wfx
    # -- WFX southbound/client API port.
    clientPort: 9080
    # -- WFX northbound/management API port.
    managementPort: 9081
    logs:
      # -- WFX log format.
      format: json
      # -- WFX log level.
      level: debug
    postgres:
      # -- PostgreSQL database name for WFX.
      database: wfx
      # -- PostgreSQL SSL mode for WFX.
      sslmode: disable
      iamAuth:
        # -- Enable AWS RDS IAM authentication for PostgreSQL.
        enabled: false
        # -- AWS region used for PostgreSQL IAM authentication.
        region: ""
    routing:
      # -- Expose WFX through the Lamassu Gateway.
      enabled: true
      # -- Gateway path for the WFX southbound/client API.
      sbiPath: /api/wfx/sbi/
      # -- Explicit rewrite path for WFX southbound/client API.
      rewriteSbiPath: /api/wfx/
      # -- Gateway path for the WFX northbound/management API.
      nbiPath: /api/wfx/nbi/
      # -- Explicit rewrite path for WFX northbound/management API.
      rewriteNbiPath: /api/wfx/
      # -- Path used when rewriting Gateway routes to WFX.
      rewritePath: /api/wfx/
    extraEnv: []
    # -- Additional command line arguments for the WFX container.
    extraArgs: []
  alerts:
    # -- Docker image for the Alerts component
    image: ghcr.io/lamassuiot/lamassu-alerts:dev-v4
    autoscaling:
      maxReplicas: 3
    smtp_server:
      # -- email address to use as the sender of the alerts
      from: ""
      # -- skip TLS verification
      insecure: false
      # -- use TLS for the SMTP connection
      enable_ssl: true
      # -- SMTP server username
      username: ""
      # -- SMTP server password
      password: ""
      # -- SMTP server hostname
      host: ""
      # -- SMTP server port
      port: 25
  authz:
    # -- Docker image for the Authz connector component
    image: ghcr.io/lamassuiot/lamassu-authz:dev-v4
    # -- JWKS endpoint used by authz to validate JWTs
    jwkUrl: http://auth-keycloak/auth/realms/lamassu/protocol/openid-connect/certs
    # -- PostgreSQL database name for authz principals, grants, and policies
    database: authz
    # -- Map of schema name to database name for per-schema Postgres credentials. Uses global postgres credentials.
      # e.g. credentials: { pki: { database: pki_db } }
    credentials: {}
    # -- Bootstrap entries: list of {principal_id, principal_name, principal_type, auth_config, policy_ids}
    # Seeded by the pre-install/pre-upgrade database Job, after the policies are
    # preloaded. Creating a principal that already exists is a no-op, so these
    # entries are safe to leave in place across upgrades.
    #
    # The default grants full access to anyone whose OIDC token carries the
    # "pki-admin" realm role. Without it a fresh install — and an upgrade from
    # 3.8.0, where authz did not exist — comes up with no principals at all and
    # nobody able to administer the PKI. Assign that role deliberately in the
    # identity provider, or replace this entry with your own matching rule.
    bootstrap:
      - principal_id: "oidc:pki-admin"
        principal_name: "PKI Admin"
        principal_type: "oidc"
        policy_ids:
          # SUPER ADMIN — full access to the service APIs
          - "lamassu.a6811b60-5f89-4ce7-badb-78ea234794d3"
          # Job Manager - Mgmt NBI Admin — workflow/job management HTTP routes.
          # Only meaningful when services.wfx.enabled is true; harmless otherwise.
          - "lamassu.7df018c1-3140-4a35-9067-2e7d6cec3ed2"
        auth_config:
          claims:
            - claim: "realm_access.roles"
              operator: "contains"
              value: "pki-admin"
  # -- AWS connector instances keyed by stable connector ID.
  connectors: {}
connectivityTest:
  # -- Image for the `helm test` connectivity-check hook. The public,
  #    upstream-maintained curl image (pinned by digest) rather than a
  #    chart-owned image, since the hook only needs curl and a POSIX shell.
  image: curlimages/curl@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
  # -- Security context for the connectivity-check hook container.
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
migrations:
  db:
    image: ghcr.io/lamassuiot/lamassu-lamassu-db-migration:dev-v4
    databases:
      - alerts
      - ca
      - va
      - devicemanager
      - dmsmanager
      - kms
  caToKms:
    # -- Enable the CA-to-KMS key migration pre-upgrade hook. Only needed when upgrading from a version prior to 3.7.0.
    enabled: false
    # -- Docker image for the CA-to-KMS migration tool
    image: ghcr.io/lamassuiot/lamassu-ca-to-kms-migration:dev-v4
